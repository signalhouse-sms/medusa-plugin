name: Publish to npm

# Publishes when a version tag (v0.1.2, v1.0.0, ...) is pushed.
# Authenticates with npm trusted publishing (GitHub OIDC), so no npm token or 2FA prompt is needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment on the npm trusted publisher.
    environment: Main
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm publish
